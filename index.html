<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oitavas do Eu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #333;
    }
    header {
      background: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      letter-spacing: 1px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .post {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .post h2 {
      margin-top: 0;
    }
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>Oitavas do Eu</header>

  <main>
    <div class="post">
      <h2>Primeiro Post</h2>
      <p>Bem-vindo(a) ao Oitavas do Eu. Aqui começam seus textos, poemas, pensamentos e tudo mais que você quiser publicar.</p>
    </div>
  </main>

  <footer>© 2025 Oitavas do Eu</footer>
</body>
</html>
